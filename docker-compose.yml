# Execução local: PostgreSQL, API e web. Credenciais agro/agro são só de desenvolvimento.
# Com dados fictícios: SPRING_PROFILES_ACTIVE=demo docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro
      POSTGRES_DB: agro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: apps/api
    environment:
      DB_URL: jdbc:postgresql://db:5432/agro
      DB_USER: agro
      DB_PASSWORD: agro
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  pgdata:
