# Configuração base. Variáveis de ambiente (ADR-0003): DB_URL, DB_USER, DB_PASSWORD.
# Os padrões abaixo são as credenciais de desenvolvimento local (agro/agro), as únicas permitidas no repositório.
spring:
  application:
    name: agro-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agro}
    username: ${DB_USER:agro}
    password: ${DB_PASSWORD:agro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Integração (change integration-pipeline). Todos os valores abaixo são os padrões.
agro:
  integration:
    max-batch-size: 1000          # itens por lote; acima disso a ingestão responde 413
    max-attempts: 5               # tentativas antes de a mensagem ir para a DLQ
    worker-batch-size: 20         # mensagens reservadas por ciclo do worker
    lease: PT2M                   # duração da reserva; vencida, a mensagem volta a ser elegível
    poll-interval: PT5S           # intervalo do agendador do worker
    scheduler-enabled: true       # false desliga o agendador (o ciclo manual continua possível)
    manual-run-enabled: false     # true habilita POST /api/integration/worker/run
    backoff-base: PT5S
    backoff-max: PT10M
    backoff-jitter: 0.1

# Versão em execução: /actuator/info mostra o SHA do commit (variável APP_VERSION, definida na imagem pelo deploy).
info:
  app:
    version: ${APP_VERSION:dev}
