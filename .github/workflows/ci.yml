name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # reaproveitado pelo workflow de deploy, que só publica com o CI verde

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Sem cache do Turbo no CI: o Maven precisa rodar sempre (design do change foundation).
      TURBO_FORCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - run: pnpm install --frozen-lockfile

      - name: Documentação (links e índice de ADRs)
        run: pnpm docs:check

      # API (Maven: testes unitários, ArchUnit e *IT com Testcontainers) e web (typecheck, testes e build)
      - name: Verificar tudo
        run: pnpm verify

      # Relatórios e sumário rodam mesmo com testes falhando (if: always()).
      - name: Sumário dos testes
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = fail = skip = 0
          for f in glob.glob("apps/api/target/*-reports/TEST-*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fail += int(r.get("failures", 0)) + int(r.get("errors", 0)); skip += int(r.get("skipped", 0))
          print("## Testes da API")
          print(f"| Total | Passaram | Falharam | Ignorados |\n|---|---|---|---|\n| {total} | {total - fail - skip} | {fail} | {skip} |")
          PY

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            apps/api/target/surefire-reports
            apps/api/target/failsafe-reports
          if-no-files-found: ignore
