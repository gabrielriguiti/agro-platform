name: Deploy

# Automático em main depois do CI verde; manual (workflow_dispatch) para reimplantar ou reverter uma tag já publicada.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (SHA) já publicada no GHCR para implantar, ex.: reversão para a versão anterior"
        required: true

# Nunca dois deploys ao mesmo tempo; o segundo espera o primeiro terminar.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SITE_URL: https://agro.gabrielriguiti.com.br

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/agro-api:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/agro-web:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [build]
    # always(): no workflow_dispatch os jobs ci e build são ignorados, e o deploy ainda deve rodar.
    if: ${{ always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          [[ "$tag" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Tag inválida"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A chave só executa "deploy <tag>" (command= no authorized_keys); a chave do servidor é fixada,
      # sem confiança no primeiro uso. Nenhum dos dois valores aparece no log (são secrets).
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Implantar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TAG"

      - name: Conferir a versão no ar
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$SITE_URL/actuator/health"
          echo
          version="$(curl -fsS "$SITE_URL/actuator/info")"
          echo "$version"
          echo "$version" | grep -q "$TAG"
